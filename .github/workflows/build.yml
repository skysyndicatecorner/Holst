# Builds Holst for Windows, Linux and Android on every push.
# Download the results from the "Actions" tab → latest run → "Artifacts".
# Push a tag like v0.1.0 to also publish them on the "Releases" page.
name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Holst-Windows
          path: |
            dist/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Holst-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - name: Use the project's fixed debug key (so new APKs install over old ones)
        run: |
          mkdir -p ~/.android
          cp resources/android/debug.keystore ~/.android/debug.keystore
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/android-setup.js
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/Holst-$(node -p "require('../package.json').version")-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Holst-Android
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
